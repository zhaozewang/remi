[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "remi-demo"
version = "0.1.0"
description = "One compact REMI recall and planning notebook"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "faiss-cpu>=1.8",
  "ipykernel>=6",
  "jupyterlab>=4",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "omegaconf>=2.3,<3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "termcolor>=2.4",
  "torch>=2.3",
]

[tool.setuptools.packages.find]
include = ["remi*"]
